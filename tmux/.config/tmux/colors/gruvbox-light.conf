set -g @thm_bg "#fbf1c7"
set -g @thm_fg "#3c3836"
set -g @thm_rosewater "#d65d0e"
set -g @thm_flamingo "#b16286"
set -g @thm_pink "#8f3f71"
set -g @thm_mauve "#8f3f71"
set -g @thm_red "#9d0006"
set -g @thm_maroon "#cc241d"
set -g @thm_peach "#af3a03"
set -g @thm_yellow "#b57614"
set -g @thm_green "#79740e"
set -g @thm_teal "#427b58"
set -g @thm_sky "#689d6a"
set -g @thm_sapphire "#458588"
set -g @thm_blue "#076678"
set -g @thm_lavender "#076678"
set -g @thm_subtext_1 "#504945"
set -g @thm_subtext_0 "#665c54"
set -g @thm_overlay_2 "#7c6f64"
set -g @thm_overlay_1 "#928374"
set -g @thm_overlay_0 "#a89984"
set -g @thm_surface_2 "#bdae93"
